[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shittim-core"
version = "0.1.0a6"
description = "A source-integrated QQ collaboration agent"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md", "third_party/LICENSES/*.txt", "third_party/LICENSES/*.md"]
dependencies = ["openai==2.24.0", "httpx==0.28.1", "websockets==16.1.1", "jsonschema==4.26.0", "PyYAML==6.0.3", "ddgs==9.16.0", "trafilatura==2.3.1", "mcp==2.3.0", "pypdf==6.21.1", "python-docx==1.2.0", "openpyxl==3.1.5", "Pillow==13.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "hypothesis==6.170.1", "ruff==0.17.1", "pyright==1.1.414"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/shittim-core" = ["LICENSE", "NOTICE.md", "requirements-runtime.lock", "requirements-dev.lock"]
"share/shittim-core/third_party" = ["third_party/*.json"]
"share/shittim-core/third_party/LICENSES" = ["third_party/LICENSES/*.txt", "third_party/LICENSES/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -m 'not qq_live and not model_live'"
markers = ["qq_live: explicit real QQ test batch", "model_live: explicitly enabled real model requests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/shittim_core/engine/hermes"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src"]
ignore = ["src/shittim_core/engine/hermes"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
